[project]
name = "cadkit"
version = "0.1.0"
description = "Builds Silent Water's mechanical assets: CAD solids (build123d) to GLBs, assembled into Godot scenes. See docs/asset_process.md."
requires-python = ">=3.13"
dependencies = [
    "build123d==0.13.0",
    "numpy>=2.0",
    "pillow>=11.0",
    "pyyaml>=6.0",
    "trimesh>=4.0",
]

[project.scripts]
cadkit = "cadkit.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cadkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
