# Hand-built scenes and control behaviours the game already has. Generated scenes carry their own component.yaml
# beside their .tscn. `cadkit catalogue` shows both. Add an entry here when a hand-built scene or a new behaviour
# lands that an asset could use; a behaviour not listed here is a development arc, not asset work.
scenes:
  - slug: noise_gauge
    kind: display
    scene: res://src/noise/noise_gauge.tscn
    script: Gauge
    summary: The noise repeater (sub vs ocean needles), a configured `gauge`. Every station gets one.
    tags: [gauge, noise, repeater, dial]
    size: radius 0.13 m by default; set `radius` on the instance. Envelope, depth and triangles are the generated `gauge` entry's
    mount: dial face toward +Z, as `gauge`
  - slug: flat_chart
    kind: display
    scene: null
    script: res://src/map/flat_chart.gd
    summary: The sonar bearing chart drawn to a square quad; heading-up, sub at centre.
    tags: [screen, chart, display, sonar, map]
    size: square only, screen_size edge (m)
    mount: faces the parent's -Z (it turns itself 180 degrees in _ready)
  - slug: headset
    kind: wearable
    scene: res://src/sonar/headset.tscn
    summary: Sonar headset (Wearable); sitting at the sonar seat puts it on.
    tags: [headset, wearable, sonar]
    size: about 0.2 m across
  - slug: hydrophone_wheel
    kind: control
    scene: res://src/sonar/hydrophone_wheel.tscn
    summary: Handwheel that trains the hydrophone (primitive meshes).
    tags: [wheel, handwheel, hydrophone, bearing]
    notes: valve-style handwheel; the cockpit concept replaces it with a trackball
  - slug: toggle_switch
    kind: control
    scene: res://assets/models/kit/toggle_switch/toggle_switch.tscn
    summary: Onshape-modelled guarded toggle (4,606 triangles, over the kit budget).
    tags: [toggle, switch, guarded]
behaviours:                           # scripts a generated scene may use, controls and displays alike; a new one is a development arc
  - {script: Gauge, file: res://src/interact/gauge.gd, does: "dial display; reads a readout from a source group (see the generated `gauge` entry); optional `scale_readout` export (default empty) takes min_value/max_value as -/+ that readout (e.g. `top_speed`, the sub model's terminal forward speed) so the scale follows tuning; optional `zone_from` (default NAN, none), `zone_to` (default max_value) and `zone_swatch` (default light_alarm) draw a coloured band along the scale, e.g. a red zone at the top"}
  - {script: FlatChart, file: res://src/map/flat_chart.gd, does: "square chart screen; draws the sonar bearing chart"}
  - {script: Lever, file: res://src/interact/lever.gd, does: pivots about local X by mouse drag}
  - {script: SwitchLever, file: res://src/interact/switch_lever.gd, does: Lever that snaps to its two ends}
  - {script: GuardedSwitch, file: res://src/interact/guarded_switch.gd, does: "SwitchLever under a hinged cap, posed on a child node named `Cap` (or the `cap` export; rotated about X by `cap_open_deg`, default -100): click one lifts the cap, click two sets on and the cap stays open, click from on sets off and closes it; a cap over an off switch drops after `drop_timeout` (default 5 s); hints click to lift the cap / click to switch; cap state host-run and replicated"}
  - {script: Valve, file: res://src/interact/valve.gd, does: handwheel turned by circling the mouse}
  - {script: HydrophoneWheel, file: res://src/sonar/hydrophone_wheel.gd, does: Valve that trains the hydrophone}
  - {script: SpringAxis, file: res://src/interact/spring_axis.gd, does: key-driven -1..1 axis that springs back}
  - {script: StationSeat, file: res://src/interact/station_seat.gd, does: "E to sit; holds the player at sit_point"}
  - {script: SonarSeat, file: res://src/sonar/sonar_seat.gd, does: StationSeat that puts the headset on}
  - {script: Wearable, file: res://src/interact/wearable.gd, does: picked up and worn}
  - {script: PushButton, file: res://src/interact/push_button.gd, does: "momentary press; springs back (#345)"}
  - {script: Trackball, file: res://src/sonar/trackball.gd, does: "drag sideways trains the hydrophone (#345)"}
  - {script: PanBall, file: res://src/interact/pan_ball.gd, does: "trackball that emits a 2D roll delta (not a bearing)"}
  - {script: ZoomLever, file: res://src/interact/zoom_lever.gd, does: "spring-centred lever emitting a -1..1 zoom rate"}
  - {script: IndicatorLamp, file: res://src/interact/indicator_lamp.gd, does: "lit/unlit display lamp bound to a bool"}
  - {script: LinearGauge, file: res://src/interact/linear_gauge.gd, does: "bar display; rises from the bottom of a vertical track with a readout from a source group, colour steps at warn_at/alarm_at (default 50% and 85%, ok to alarm upward); `descending` export flips the bands so low is the alarm end (ok above warn_at, alarm at or below alarm_at)"}
  - {script: MultiDisplay, file: res://src/interact/multi_display.gd, does: "round screen quad (screen_diameter) with up to four widget slots (top, left, right, bottom); each a MultiDisplaySlot resource reading a named readout from a source group as number, text, pie, dial, vertical bar (signed) or empty; palette swatches, warning thresholds switch to indicator swatches and add ! marks; optional centre chevron column (chevrons_enabled, chevron_readout, chevron_count, chevron_step: up positive, down negative) and edge ring (ring_enabled, ring_readout, ring_segments, ring_warn_below, ring_alarm_below; steps light_ok/warn/alarm); `preset` export takes a MultiDisplayPreset resource (pilot one: assets/models/cockpit/pilot_multidisplay.tres); all off by default; faces +Z"}
  - {script: DepthFinder, file: res://src/interact/depth_finder.gd, does: "echo-sounder display: a MeshInstance3D quad (screen_size, faces +Z) showing a side-on trace of the sea floor along the sub heading (range_behind..range_ahead, depth_span centred on sub depth, columns samples) from height_at of the node in group terrain_site (CanyonSite), with a sub marker at mid-height; palette swatch exports (trace_swatch, face_swatch); texture on the quad itself, so no child nodes needed; height_source Callable overrides the site"}
  - {script: Navball, file: res://src/interact/navball.gd, does: "attitude ball: a Ball MeshInstance3D child held at the inverse of SubFrame.render_transform() (times exported mount_rotation_deg), apex to world up, N to north; shader samples navball_mask.png by object-space direction (+Y apex, -Z north, ball needs no UVs) with palette swatch exports; HDG (000-359) and PITCH (signed degrees) Label3D children (paths exported) read heading_deg/pitch_deg from the sub_readouts group"}
  - {script: ScrubberCanister, file: res://src/interact/scrubber_canister.gd, does: "carried CO2 canister; lifted straight out of a slot and dropped back; `capacity` 0..1 is a plain export (local only, no net sync)"}
  - {script: CanisterSlot, file: res://src/interact/canister_slot.gd, does: "seat for one ScrubberCanister (cradle or storage hole); refuses a second, releases on lift-out; canister stands along the slot's +Y"}
  - {script: CanisterRing, file: res://src/interact/canister_ring.gd, does: "ring of 12 light segments round a canister top (XZ circle, about 300 degrees); lit run and colour (green/yellow/red) follow the bound canister's capacity"}
  - {script: JoystickIndicator, file: res://src/interact/joystick_indicator.gd, does: "display-only stick: tilts a `stick` node from one SpringAxis (`fore_aft`: throttle, planes) or two (`side` adds rudder tilt, side to side); `max_deg` export; no input"}
  - {script: HeadlightSwitch, file: res://src/sub/headlight_switch.gd, does: "external light from two switches: `power` (Interactable, upper half = on) shows or hides `light`; optional `colour` switch swaps its PaletteLight between light_work_white and light_stealth_red (swatch exports)"}
  - {script: CabinSwitch, file: res://src/sub/cabin_switch.gd, does: "cabin lights from two switches: `power` sets CabinLights.enabled (dimmer still sets the level when on), `stealth_switch` sets CabinLights.stealth; `lights` export names the CabinLights node"}
  - {script: ThresholdLamp, file: res://src/interact/threshold_lamp.gd, does: "lights its IndicatorLamp (`lamp` export) when `readout` from a source group (default sub_readouts) is above (or, `above` off, below) `threshold`; `threshold_of` names a readout to scale by (BILGE: threshold 0.25 of `bilge_limit`); no readout or no source means unlit"}
  - {script: BreakerSwitch, file: res://src/interact/breaker_switch.gd, does: "click toggle for one PowerSystem breaker (`circuit` export; `power` export or the power_system group); `handle` Node3D pitches about X and `lamp` MeshInstance3D takes light_ok/warn/alarm (dark when off) from the breaker_<circuit> readout: on handle up, off down, tripped mid-way, blown limp; a click switches it (resets a trip), on a blown one requests a replacement (nothing at 0 spares); never grabbed, no drag"}
  - {script: SparesDrawer, file: res://src/interact/spares_drawer.gd, does: "display-only spares drawer: shows the first N of its `slots` (Node3D array) where N is the power system's `spares_remaining` readout (`power` export or the power_system group) clamped to the slot count; zero shows none"}
  - {script: GeneratorLink, file: res://src/interact/generator_link.gd, does: "ties a SwitchLever (`switch_lever` export) to the generator (`power` export or the power_system group): a throw by the player holding it sends request_generator(start/stop); when the `generator_running` readout changes by itself (trip, heat shutdown, finished start) the switch is moved to match without a request"}
  - {script: DropWeightsButton, file: res://src/sub/drop_weights_button.gd, does: "drop-weights release: a press of `button` (PushButton) counts only while `guard` (Interactable, two-position hinge, upper half = open) is open; once per dive the host sheds the weights' mass from the sub model (`controller` export or the sub_controller group), emits `released` and records it in the SessionLog; replicated, `reset` re-arms (optional `director` export re-arms on dive_reset)"}
  - {script: HandPump, file: res://src/interact/hand_pump.gd, does: "manual bilge pump lever (`leaks` export or the leak_system group): holding it is the down stroke (0.6 s), release springs back (0.4 s), a 0.5 s refill beat follows; each stroke bails in proportion through LeakSystem.manual_bail (~0.035 t/s steady, no power, no noise); host-run, value streamed to clients"}
  - {script: ScienceBay, file: res://src/science/science_bay.gd, does: "one science module bay; holds at most one ScienceModule built from its ModuleLoadout slot; empty is valid"}
  - {script: ScienceModule, file: res://src/science/science_module.gd, does: "base contract of a science instrument module: armed, health 0..1, time_left, hint string (what would help); SCAN/SWEEP/PROBE/CAMERA extend it"}
  - {script: ScienceStation, file: res://src/science/science_station.gd, does: "StationSeat for the science bays; one standing operator; A/D select the active fitted module (wraps), F arms it, E/Esc step back"}
  - {script: ScanModule, file: res://src/science/scan_module.gd, does: "SCAN science module: arming it arms ScanObjective (as the wall switch does; `objective` export or the scan_objectives group); ring() = progress, range_m(), hint CLOSER out of range; draws the DISPLAYS circuit via PowerSink, unpowered it disarms; optional `arm_switch` (a SwitchLever) arms/stops it and follows its state"}
  - {script: ScanScreen, file: res://src/science/scan_screen.gd, does: "MeshInstance3D quad (screen_size, faces +Z) child of a ScanModule: progress ring texture plus range and hint Label3Ds; dark when unpowered; palette swatch exports ring_swatch, face_swatch"}
  - {script: SweepModule, file: res://src/science/sweep_module.gd, does: "SWEEP science module (bathymetry sounder): arming it arms SweepObjective (`objective` export or the sweep_objectives group); coverage(), cell_swatch(ix, iz) palette swatch for the screen grid, hint TO AREA; draws the DISPLAYS circuit via PowerSink"}
  - {script: ModuleLoadout, file: res://src/science/module_loadout.gd, does: "Resource: which module type (SCAN, SWEEP, PROBE, CAMERA, or none) is fitted in each of the three bays; default SCAN, SWEEP, CAMERA"}
