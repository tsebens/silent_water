# Provider selection for the asset pipeline. Each stage names a provider (and optionally a model id).
# Commands override a stage default with --image-provider / --3d-provider / --prompt-writer.
# API keys come from environment variables (tools/asset_pipeline/.env, git-ignored); never put them here.
defaults:
  concept_prompts: prompt_writer
  concept: image
  turnaround: image
  brief: prompt_writer
  to3d: three_d

# Stage defaults: which named provider each kind uses when a command does not override it.
selection:
  image: mock
  three_d: mock
  prompt_writer: mock

providers:
  image:
    mock: {model: mock-image-1}
    # Hosted image adapters. Keys: OPENAI_API_KEY, GEMINI_API_KEY, FAL_KEY (tools/asset_pipeline/.env).
    # A new provider on an existing adapter is an entry here: `adapter:` names the adapter file's class.
    # OpenAI GPT Image 2.5 Sunburst. Docs: https://developers.openai.com/api/docs/models (checked 2026-11-22);
    # Replacement for the retired GPT Image 1 is named at https://developers.openai.com/api/docs/deprecations.
    openai: {model: gpt-image-2.5-sunburst, size: 1024x1024}
    # Nano Banana 2.1. Docs: https://aistudio.google.com/docs/models (checked 2026-11-22).
    google: {model: gemini-nano-banana-2.1}
    # Nano Banana Pro (Gemini 3 Pro Image), same adapter. Docs: https://aistudio.google.com/docs/models (checked 2026-11-22).
    google-pro: {adapter: google, model: gemini-3-pro-image}
    # fal FLUX Pro 1.1 was not part of this model-ID update; unchanged.
    fal: {model: fal-ai/flux-pro/v1.1}
    # Example (FLUX Kontext keeps the source image on edits):
    # flux-kontext: {adapter: fal, model: fal-ai/flux-pro/kontext, edit_model: fal-ai/flux-pro/kontext}
  three_d:
    mock: {model: mock-3d-1}
    # Hosted image-to-3D. `views:` (default front, left, back, right) lists the turnaround views `to3d` sends, in order;
    # a listed view the asset does not have is skipped. Keys: TRIPO_API_KEY, MESHY_API_KEY,
    # RODIN_API_KEY (model = tier), FAL_KEY. Hunyuan3D is not shipped (licence excludes EU/UK/KR, #219).
    # Tripo H3.1 snapshot. Docs: https://developers.tripo3d.ai/en/models/v3-1 (checked 2026-11-22). P2.0's ID is unconfirmed (#256).
    tripo: {model: v3.1-20260211}
    # Meshy 7.1. Docs: https://docs.meshy.ai/en/api/multi-image-to-3d (checked 2026-11-22).
    meshy: {model: meshy-7.1}
    # Rodin Gen-2.5 (model = tier). Docs: https://docs.hyper3d.ai/en/api-specification/rodin-gen2-5 (checked 2026-11-22).
    rodin: {model: Gen-2.5-Medium}
    # TRELLIS.2 on fal. Docs: https://fal.ai/models/fal-ai/trellis-2/api (checked 2026-11-22).
    # fal-ai/trellis-2 takes ONE image (`image_url`), so `input: single` sends the front view only;
    # use `input: multi` (sends `image_urls`) for an endpoint that takes several views.
    trellis: {model: fal-ai/trellis-2, input: single, views: [front]}
    # TRELLIS v1 multi-image on fal: up to 8 views as `image_urls`, GLB in `model_mesh`.
    # Docs: https://fal.ai/models/fal-ai/trellis/multi/api (checked 2026-11-22; price not listed there).
    trellis-multi: {adapter: trellis, model: fal-ai/trellis/multi, input: multi, views: [front, left, back, right, top, bottom]}
  prompt_writer:
    mock: {model: mock-writer-1}
    # Claude Code CLI: `claude -p ... --output-format json`, uses the logged-in subscription
    # (or CLAUDE_CODE_OAUTH_TOKEN, read by claude itself). Set `command` to override the binary.
    claude-cli: {model: claude-sonnet-5-5}
    # Messages API with ANTHROPIC_API_KEY (API billing). Never uses the OAuth token.
    anthropic-api: {model: claude-sonnet-5-5}
