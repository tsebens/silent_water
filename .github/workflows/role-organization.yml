name: "Role: organization"

# Breaks a concept issue into proposed arcs. Spec: docs/process.md. Prompt: .github/agents/organization.md.
# Fires when `concept` or `plan-rejected` is ADDED to an issue (the label just applied, not labels present).

on:
  issues:
    types: [labeled]

concurrency:
  group: organization-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  organization:
    if: >-
      vars.PIPELINE_PAUSED != 'true' &&
      (github.event.label.name == 'concept' || github.event.label.name == 'plan-rejected') &&
      !contains(github.event.issue.labels.*.name, 'needs-human') &&
      !contains(github.event.issue.labels.*.name, 'plan-proposed') &&
      !contains(github.event.issue.labels.*.name, 'plan-approved')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: ./.github/actions/claude-role
        with:
          role: organization
          context: |
            - Event: `issues.labeled`, label added: `${{ github.event.label.name }}`
            - Concept issue: #${{ github.event.issue.number }} "${{ github.event.issue.title }}"
            - Labels on the issue now: ${{ join(github.event.issue.labels.*.name, ', ') }}
          github-token: ${{ secrets.GH_MCP_PAT }}
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed-tools: "Bash,Read,Glob,Grep"
