name: Dispatch

# Pipeline dispatcher. Spec: docs/process.md, "Dispatcher". Logic: .github/scripts/dispatch.sh.
#
# Runs when work may have become claimable (an arc labeled ready, an issue closed,
# a PR closed) and every 15 minutes as a safety net for dropped events.

on:
  schedule:
    - cron: "*/15 * * * *"
  issues:
    types: [labeled, closed]
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log what would change without changing anything
        type: boolean
        default: true

# Dispatcher runs must not interleave, or two runs could claim past the cap.
# One pending run is enough: the latest run reconciles everything from the labels.
concurrency:
  group: dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      vars.PIPELINE_PAUSED != 'true' &&
      (github.event_name != 'issues' || github.event.action != 'labeled' || github.event.label.name == 'ready')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # A PAT, not GITHUB_TOKEN: the board is a user project and the labels this
      # run applies must fire webhooks and other workflows. Same value as the cloud
      # environment's GITHUB_MCP_PAT; Actions reserves the GITHUB_* prefix.
      GH_TOKEN: ${{ secrets.GH_MCP_PAT }}
      FIRE_URL_DEV: ${{ secrets.FIRE_URL_DEV }}
      FIRE_TOKEN_DEV: ${{ secrets.FIRE_TOKEN_DEV }}
      WORKER_CAP: ${{ vars.WORKER_CAP || 2 }}
      PIPELINE_PAUSED: ${{ vars.PIPELINE_PAUSED || 'false' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/dispatch.sh
