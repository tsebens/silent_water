name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # ci-green is applied with the PAT, not GITHUB_TOKEN: label events made with
      # GITHUB_TOKEN do not start other workflows, and the review role fires on this label.
      GH_TOKEN: ${{ secrets.GH_MCP_PAT }}
      PR: ${{ github.event.pull_request.number }}
      IS_LOCAL_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # the PR merge commit and its parents, to see which files the PR changed

      # The review role fires when ci-green is ADDED (docs/process.md, "Triggers"). Drop it on
      # every PR run so the label only ever describes the current head; add it back on success.
      - name: Clear ci-green
        if: env.IS_LOCAL_PR == 'true'
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label ci-green || true

      - name: Dispatcher unit tests
        run: .github/scripts/test_dispatch.sh

      - uses: astral-sh/setup-uv@v5

      - uses: ./.github/actions/setup-blender

      - name: Asset pipeline tests
        working-directory: tools/asset_pipeline
        run: uv run pytest -q

      # Generated assets (docs/asset_process.md): the GLBs, scenes and catalogue entries under assets/models/ must be
      # exactly what their build scripts make. Runs only when a PR touches the scripts, the generated tree or the
      # palette; always on a push. It is part of this job so that ci-green cannot be applied without it.
      - name: Did generated assets or their scripts change?
        id: cad
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          if echo "$changed" | grep -qE '^(tools/cadkit/|assets/models/|assets/palette/|\.github/actions/setup-cadkit/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-cadkit
        if: steps.cad.outputs.run == 'true'

      - name: cadkit tests and generated-asset sync
        if: steps.cad.outputs.run == 'true'
        working-directory: tools/cadkit
        run: |
          uv run pytest -q
          uv run cadkit verify

      - uses: ./.github/actions/setup-godot

      - name: Check project
        run: tools/check.sh

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-logs
          path: ${{ runner.temp }}/godot-logs

      - name: Mark ci-green
        if: success() && env.IS_LOCAL_PR == 'true'
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label ci-green

      # A red arc PR goes back to the development role (rework mode) through the same label
      # the reviewer uses, with a comment that says CI, not a reviewer, sent it.
      - name: Send arc PR to rework
        if: failure() && env.IS_LOCAL_PR == 'true' && startsWith(github.event.pull_request.head.ref, 'arc/')
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "## CI failed

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (head ${HEAD_SHA}). The development role takes it from here in rework mode; Godot output is in the run's \`godot-logs\` artifact."
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label changes-requested

  # The Docker runner for `asset cleanup`: build the image from the versions.yaml pin (buildx, Actions
  # cache), check Blender inside it, run the fixture cleanup through it, and make sure nothing it wrote
  # is root-owned. The `check` job keeps setup-blender and covers the native runner.
  docker-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: docker/setup-buildx-action@v3

      - name: Read the Blender pin
        id: pin
        working-directory: tools/asset_pipeline
        run: |
          echo "version=$(uv run python -c "import yaml;print(yaml.safe_load(open('versions.yaml'))['blender']['version'])")" >> "$GITHUB_OUTPUT"
          echo "major_minor=$(uv run python -c "import yaml;print(yaml.safe_load(open('versions.yaml'))['blender']['major_minor'])")" >> "$GITHUB_OUTPUT"

      - name: Build the Blender image
        uses: docker/build-push-action@v6
        with:
          context: tools/asset_pipeline/docker
          file: tools/asset_pipeline/docker/blender.Dockerfile
          build-args: BLENDER_VERSION=${{ steps.pin.outputs.version }}
          tags: silent-water/blender-cleanup:${{ steps.pin.outputs.version }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Blender reports the pinned version
        env:
          IMAGE: silent-water/blender-cleanup:${{ steps.pin.outputs.version }}
          MM: ${{ steps.pin.outputs.major_minor }}
        run: |
          out=$(docker run --rm "$IMAGE" --version)
          echo "$out"
          echo "$out" | grep -E "^Blender ${MM//./\\.}\\.[0-9]+"

      - name: Docker cleanup integration test
        working-directory: tools/asset_pipeline
        env:
          ASSET_BLENDER_RUNNER: docker
        run: |
          # Test roots live under .asset_work/ so the ownership check below sees everything written.
          mkdir -p "$GITHUB_WORKSPACE/.asset_work"
          uv run pytest -q -rs tests/test_cleanup_runner.py -k docker_cleanup \
            --basetemp="$GITHUB_WORKSPACE/.asset_work/ci"

      - name: No root-owned files under .asset_work
        run: |
          test -d .asset_work/ci
          find .asset_work -name '*.glb' | grep -q . || { echo "no cleanup output found"; exit 1; }
          root_owned=$(find .asset_work -user root)
          if [ -n "$root_owned" ]; then echo "root-owned files:"; echo "$root_owned"; exit 1; fi

  # Manifest and report paths must be forward-slash on Windows too. Needs neither Godot nor Blender.
  windows-paths:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: POSIX path test
        working-directory: tools/asset_pipeline
        run: uv run pytest -q tests/test_posix_paths.py
