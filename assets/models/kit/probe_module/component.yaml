summary: 'PROBE science module (winch): the shared module chassis with a cable reel (its own GLB under ReelPivot,
  turns about Z), a mechanical depth-counter window, a sample-point list screen and a lit winch switch. The root
  is a ProbeModule. Connect WinchSwitch''s value_changed to toggle_armed; the station sets ReelPivot.rotation.z
  from reel_angle() and draws the counter and list.'
