# Review brief for the navball kit scene (concept #459, arc #467). Pairs each concept image with its render camera.
station: navball
concept:
  images:
    - path: assets/models/cockpit/concept/navball_housing_reference.png
      role: primary
      view: from the seated pilot's eye, about 0.7 m away and slightly above
      camera: concept_housing
    - path: assets/models/cockpit/concept/navball_readouts_reference.png
      role: primary
      view: from the seated pilot's eye, straight on (digit windows and reticle only)
      camera: concept_readouts
  doc: assets/models/cockpit/concept/cockpit_concept.md
  compare_on:
    - the housing: round bezel, glass dome, square plate, orange ring, label plate, matching the multidisplay
    - the ball: two contrasting hemispheres split by the horizon, the pitch ladder, heading marks round the horizon
    - the reticle: two orange arms with a centre dot
    - the digit windows either side of the bezel
  ignore:
    - the exact numbers drawn on the ball and in the windows
    - the attitude the art shows, lighting mood, the cockpit around it
