slug: lit_guarded_toggle
group: kit
kind: control
summary: Guarded two-position toggle under a hinged cap, on a tall plate. Click lifts the cap, a second click sets
  the switch on and the cap stays open; click from on sets it off and closes the cap; a lifted cap over an off switch
  drops after 5 s. A real indicator lamp above the cap is lit while the switch is on and dark while off, visible
  with the cap closed, with nothing to wire.
