# Station brief for the countermeasures station (concept #758), from the concept issue.
station: countermeasures_station

concept:
  images:
    - path: assets/models/countermeasures/concept/countermeasures_station_primary.png
      role: primary            # the panel and the rack beside it
      view: a standing crew member in the aisle, the station on the hull ahead and to the right
      camera: concept_primary
  doc: assets/models/countermeasures/concept/countermeasures_concept.md
  compare_on:
    - overall massing: a tall flat panel flat against the hull, the decoy rack as a column of cradles beside it, orange grab rails
    - the panel's layout top to bottom: the FORE TUBE and AFT TUBE sections (lamps over guarded FIRE buttons) side by side; the status screen; the AIR and NOISE gauges
    - the rack: one decoy per cradle, the count readable at a glance
    - colour blocking, matching the life support unit
  ignore:
    - exact labels and screen content, the number of decoys drawn, the crew member and the bulkhead door, lighting mood

functions:
  - id: rack
    furniture: a column of six cradles beside the panel, each holding one decoy (the decoy kit scene from the loader concept); a player takes one by interacting with it and carries it; an empty cradle shows plainly; a carried decoy can be put back in an empty cradle
    binds: the carried decoy item (#746)
    status: control only; new; six decoys per dive, restocked at the hub later
  - id: fire
    control: a FORE TUBE and an AFT TUBE section, each a big FIRE button under a hinged guard (lift the guard, press); it fires that tube only when it is primed, otherwise nothing happens
    binds: each tube's LaunchTube fire request (#746)
    status: control only; new
  - id: tube_state
    display: per tube, LOADED and EMPTY lamps, plus PRIMED (or LOADED lit only when primed; the build decides, and the lamps match the loader's own lamps)
    binds: LaunchTube state (#746)
    status: control only; new
  - id: status_screen
    display: a small screen listing each decoy in the water, its bearing and distance from the sub, and a noise bar of how loud it is where the sub is; drawn at runtime like the depth finder and the multidisplay
    binds: the decoys in the water (#746); SubFrame for bearings
    status: control only; new
  - id: air
    display: the AIR gauge, the ballast air tank's remaining air (each launch costs about 5% of the tank)
    binds: SubController readout air_fraction (shared gauge)
    status: implemented (the readout)
  - id: noise_repeater
    display: the shared noise repeater gauge
    status: implemented

constraints:
  kind: panel
  frame: back on Z=0 against the starboard hull, centred on the panel and rack, controls toward +Z
  operator_eye_m: [0.0, 0.55, 0.5]   # standing eye 1.65 m, the station centred at about 1.1 m, the crew member 0.5 m out
  reach_m: 1.1                 # from the shoulder (docs/asset_process.md)
  size: "at most 1.0 m along the hull (Tristan, 2026-11-27, the program.yaml reservation grows from 0.5 m to the full 1.0 m) and 0.45 m deep; flat against the hull so the aisle stays clear"
  triangle_budget: 10000       # panel, with the six decoys in the rack counted (Tristan, 2026-11-27, #758)
  palette: every colour a palette swatch; FIRE buttons alarm red under hazard-striped guards; lamps use the indicator swatches; the screen uses the cyan band only for readouts
  red_light: the lamps and the screen read under the stealth red cabin light
