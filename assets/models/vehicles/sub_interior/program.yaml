# Sub interior program, draft 5 (the sub experiment, from a blank sheet).
# Draft 5 takes the locked concepts: the cockpit (assets/models/cockpit/concept/, #328) and the map table
# (assets/models/map_table/concept/, #319, #329). The hull is unchanged; the map table's hologram is capped.
# The layout is data: plan.py draws and checks it, and the blockout generator will build from it.
# Concept art is painted over the blockout's renders. Tristan's vision: reference/exterior_vision_tristan.webp.
# Units: metres. Frame: sub-local, bow toward -Z, +X starboard, Y up, origin at the hull's centre.

hull:
  # Outer pressure-hull envelope: a superellipse from the top (length x width) and from the front
  # (width x height). Wider than tall and full amidships, like the concept image. An exponent of 2 is
  # a true ellipse; higher is boxier.
  length_m: 10.0
  width_m: 3.8
  height_m: 3.0
  plan_exponent: 2.6         # top view
  profile_exponent: 5.0      # side view: fuller than the plan, so the ends keep their height (a big bubble bow, a blunt stern)
  section_exponent: 2.4      # front view
  wall_m: 0.12               # plating plus frames, inside the envelope
  deck_above_bottom_m: 0.55  # bilge, piping and the lock-out trunk's chamber sit below the deck plates
  crew: 4

clearances:                  # from the player capsule (radius 0.3, height 1.75)
  aisle_min_m: 0.8           # one person passes; two must squeeze (deliberate)
  walk_around_m: 0.8         # gap needed on each side of a centre item you walk round (the map table)
  head_clear_m: 2.0          # clear height needed above the deck along the walkway
  hatch_width_m: 0.75
  hatch_height_m: 1.7
  overhead_margin_m: 0.15    # kept clear under the overhead (pipes, cove lights) when sizing the hologram

# Bow to stern. z: [from, to].
compartments:
  - id: cockpit
    z: [-4.9, -3.35]
    floor_offset_m: -0.20   # one step down, glass underfoot: the seated pilot's eyes sit near the dome's centre
    notes: >
      The pilot's bubble: one unbroken acrylic hemisphere about 2.2 m across with a heavy steel ring at its rim,
      the pilot alone on the centreline with glass all round and below, a hand's width from armrest to glass.
  - id: midships
    z: [-3.35, 1.5]
    notes: >
      The crowded catch-all and the crew's hub. Starboard: the sonar desk just aft of the dome ring, then
      countermeasures. Port: the map table in a bay in the hull wall, its operator seated in the aisle at its centre,
      observers standing along it. Then the lock-out trunk in the floor, and the conning-tower ladder and lockers by
      the bulkhead. Countermeasures and the map table face each other across the aisle.
  - id: bulkhead
    z: [1.5, 1.7]
    notes: Watertight hatch, which can isolate a flooding engineering space.
  - id: engineering
    z: [1.7, 4.7]
    notes: >
      The mechanic's end of the boat, louder and lower as the hull tapers. Engine and power, life support,
      ballast, the bilge well and the drop-weight release: every hands-on utility job, tightly packed.

# kind: seat (sit to use), chair (a free seat in the aisle), desk (a seated wall console), panel (stand at a wall),
# table, well (kneel), floor_hatch, ladder, storage, release_lever.
# side: port (-X), starboard (+X) or centre; x overrides side when given. footprint: [along the hull, across the hull].
# mount_height_m: a desk or table set into the curve of the hull; its depth is measured from the wall at that height.
stations:
  - {id: pilot,           compartment: cockpit,     kind: seat,  x: 0.0,  z: -3.8, footprint: [0.8, 0.7],
     display: {size: small, placement: a crisp 20 cm cylinder of light low on the forward end of the elbow rail, purpose: chart locked centred on the sub; maybe a little zoom, never pan or rotate}}
  - {id: sonar,           compartment: midships,    kind: desk,  side: starboard, z: -2.95, footprint: [0.7, 0.65], mount_height_m: 0.75, faces: aft,
     display: {size: large, placement: a 55 cm screen in a deep bezel on a steeply raked desk, purpose: the operator's own sub-centred view with zoom, pan and rotate; points the passive array; active sonar on and off}}
  - {id: sonar_seat,      compartment: midships,    kind: chair, side: starboard, z: -2.3, footprint: [0.6, 0.6], aft_of: sonar, faces: forward}
  - {id: countermeasures, compartment: midships,    kind: panel, side: starboard, z: -1.35, footprint: [1.0, 0.45]}
  - {id: map_table,       compartment: midships,    kind: table, side: port,      z: -1.25, footprint: [2.2, 0.9], mount_height_m: 0.75,
     hologram_height_m: 0.7,
     display: {size: table, placement: a curved slab of light filling the D-shaped top, capped at 0.7 m tall, purpose: every scale for the crew; one seated operator moves the camera, standing observers place pins}}
  - {id: map_operator,    compartment: midships,    kind: chair, side: port,      z: -1.25, footprint: [0.6, 0.6], inboard_of: map_table}
  - {id: engineering,     compartment: engineering, kind: panel, side: starboard, z: 2.3, footprint: [1.2, 0.45]}
  - {id: life_support,    compartment: engineering, kind: panel, side: port,      z: 2.3, footprint: [1.0, 0.5]}
  - {id: ballast,         compartment: engineering, kind: panel, side: port,      z: 3.25, footprint: [1.0, 0.4]}
  - {id: bilge,           compartment: engineering, kind: well,  side: centre,    z: 4.1, footprint: [0.7, 0.9]}

features:
  - id: lock_out_trunk
    compartment: midships
    kind: floor_hatch
    side: centre
    z: 0.5
    footprint: [0.9, 0.9]
    notes: >
      Floor hatch into a one-person lock-out chamber below the deck, just aft of the map table, so the crew can
      read the table and step straight out. Climb down, seal the top hatch, flood, open the bottom hatch to the
      sea; the pumps are loud. Placed for play, not engineering realism.
  - {id: tower_ladder, compartment: midships, kind: ladder, side: port, z: 1.2, footprint: [0.4, 0.35],
     notes: Up into the conning tower and its top hatch, for docking at the ship or a station.}
  - {id: lockers, compartment: midships, kind: storage, side: starboard, z: 1.2, footprint: [0.4, 0.45],
     notes: Patches, scrubber canisters, cargo.}
  - {id: drop_weights, compartment: engineering, kind: release_lever, side: starboard, z: 3.25, footprint: [0.2, 0.15],
     notes: One-time emergency release, across the aisle from the ballast valves.}

displays:
  # Two charts, not one shared view: the pilot's small locked hologram and sonar's own screen, plus the map table.
  - The pilot has a 20 cm hologram locked centred on the sub, low and out of the dome view.
  - Sonar has its own 2D screen, sub-centred by default but free to zoom, pan and rotate; it is not shared with the pilot.
  - The map table covers every scale for the crew to plan around; its hologram is capped at 0.7 m to fit the headroom.

design_notes:
  - "The operational core shares one volume: the pilot in the dome, sonar a metre behind their right shoulder, countermeasures beside sonar, and the map table across the aisle. Nobody is more than a few steps from anyone else."
  - Crew standing behind the pilot look over one head, out through the dome and down to the sea floor.
  - Countermeasures faces the map table across the aisle, so its operator watches their decoys on the hologram.
  - Rounds are an engineering job, behind the bulkhead, away from the table's chatter.
  - Ballast and the drop-weight release face each other across the aft aisle; both are about staying afloat.

# Fixed cameras for the blockout renders, and later for the paint-over concepts and the build-vs-concept comparison.
# Sub-local metres: x starboard, y up from the hull's centre (the main deck is at y = -0.95), z toward the stern.
# Standing eyes are 1.65 m above their floor (y = 0.70 on the main deck). A camera with `seat:` sits at that seat's
# eye (1.2 m above its floor) and looks along look_dir. The dome glass is left out of eye-level shots (only its rim
# ring shows), as the concept art draws it: unbroken, no mullions.
# lens_mm is a full-frame equivalent. hide: object groups left out of that render (cutaways; crew figures are
# left out of the eye-level shots so they don't block the stations a paint-over needs to see). A flat sea floor
# 2 m under the keel gives the dome views something to look down at; the cutaways hide it.
cameras:
  - {id: midships_forward, pos: [0.25, 0.70, 1.05], look: [0.0, 0.05, -4.6], lens_mm: 16, hide: [crew, dome],
     notes: "Hero. Standing by the lockers looking forward: trunk, map table (port), countermeasures and sonar (starboard), the pilot in the dome."}
  - {id: pilot_view, seat: pilot, look_dir: [0.0, -0.15, -1.0], lens_mm: 18, hide: [crew, dome],
     notes: The pilot's view out of the dome, rail and small hologram below the sightline.}
  - {id: sonar_view, seat: sonar_seat, look_dir: [-0.35, -0.35, -1.0], lens_mm: 18, hide: [crew, dome],
     notes: Seated at the sonar desk, the screen ahead and the pilot's seat past it to the left.}
  - {id: map_operator_view, pos: [0.15, 0.40, -0.85], look: [-1.2, -0.10, -1.3], lens_mm: 20, hide: [crew, dome],
     notes: "Over the seated operator's shoulder: the hologram slab ahead, the cowl above. (Seated at the chair itself, the table fills the frame.)"}
  - {id: map_observer_view, pos: [0.65, 0.70, -0.2], look: [-1.25, -0.25, -1.45], lens_mm: 18, hide: [crew, dome],
     notes: Standing in the aisle across from the table, countermeasures behind the viewer.}
  - {id: engineering_aft, pos: [0.0, 0.70, 1.55], look: [0.0, -0.35, 4.6], lens_mm: 16, hide: [crew],
     notes: From the bulkhead hatch looking aft into engineering.}
  - {id: overview, pos: [-5.6, 5.8, 6.4], look: [0.0, -0.7, -0.2], lens_mm: 32, hide: [seafloor, shell_high, dome],
     notes: Cutaway from above, port quarter, the overhead removed.}
  - {id: top, pos: [0.0, 12.0, 0.0], look: [0.0, -1.0, 0.0], ortho: 10.8, hide: [seafloor, shell_high, dome, tower],
     notes: Orthographic plan, the overhead removed.}
  - {id: side, pos: [-12.0, -0.2, 0.0], look: [0.0, -0.2, 0.0], ortho: 10.8, hide: [seafloor, shell_port, dome_port],
     notes: Orthographic section from port, the port half of the hull removed.}
