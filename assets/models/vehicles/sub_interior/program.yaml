# Sub interior program, draft 5 (the sub experiment, from a blank sheet).
# Draft 5 takes the locked concepts: the cockpit (assets/models/cockpit/concept/, #328) and the map table
# (assets/models/map_table/concept/, #319, #329). The hull is unchanged; the map table's hologram is capped.
# The layout is data: plan.py draws and checks it, and the blockout generator will build from it.
# Concept art is painted over the blockout's renders. Tristan's vision: reference/exterior_vision_tristan.webp.
# Units: metres. Frame: sub-local, bow toward -Z, +X starboard, Y up, origin at the hull's centre.

hull:
  # Outer pressure-hull envelope: a superellipse from the top (length x width) and from the front
  # (width x height). Wider than tall and full amidships, like the concept image. An exponent of 2 is
  # a true ellipse; higher is boxier.
  length_m: 10.0
  width_m: 3.8
  height_m: 3.0
  plan_exponent: 2.6         # top view
  profile_exponent: 5.0      # side view: fuller than the plan, so the ends keep their height (a big bubble bow, a blunt stern)
  section_exponent: 2.4      # front view
  wall_m: 0.12               # plating plus frames, inside the envelope
  deck_above_bottom_m: 0.55  # bilge, piping and the lock-out trunk's chamber sit below the deck plates
  crew: 4

# The cockpit's bow bubble (#594): a true hemisphere of smooth clear acrylic bulging forward of a steel ring. The ring's
# plane is the cockpit's forward boundary (the hull envelope ends there) and sits at the pilot's z (snapped to the
# nearest hull ring); the sphere's centre is on the centreline, centre_below_eye_m under the seated eye, so the cockpit
# floor plane cuts the lower part of the glass and the walkable floor is a disc inside the sphere with glass rising round it.
# max_triangles is the ceiling for the dome part: segments_round x rings_to_apex gives about 3,600.
dome:
  diameter_m: 2.2
  station: pilot             # the seat whose z and floor fix the ring and the centre
  eye_height_m: 1.15         # seated eye above the cockpit floor (the pilot seat's eye_height)
  centre_below_eye_m: 0.1    # Tristan on #605: the eye sits 0.1 m off the centre so the floor keeps a 0.33 m disc of glass
  segments_round: 60
  rings_to_apex: 30
  max_triangles: 20000

clearances:                  # from the player capsule (radius 0.3, height 1.75)
  aisle_min_m: 0.8           # one person passes; two must squeeze (deliberate)
  walk_around_m: 0.8         # gap needed on each side of a centre item you walk round (the map table)
  head_clear_m: 2.0          # clear height needed above the deck along the walkway
  hatch_width_m: 0.75
  hatch_height_m: 1.85  # the capsule is 1.75 tall: its dome would jam under a 1.7 lintel (#400)
  overhead_margin_m: 0.15    # kept clear under the overhead (pipes, cove lights) when sizing the hologram

# Bow to stern. z: [from, to].
compartments:
  - id: cockpit
    z: [-4.9, -3.35]
    floor_offset_m: -0.20   # one step down, glass underfoot: the seated pilot's eyes sit near the dome's centre
    notes: >
      The pilot's bubble: one unbroken acrylic hemisphere about 2.2 m across with a heavy steel ring at its rim,
      the pilot alone on the centreline with glass all round and below, a hand's width from armrest to glass.
  - id: midships
    z: [-3.35, 1.5]
    notes: >
      The crowded catch-all and the crew's hub. Starboard wall, bow to stern: the sonar console turned to the hull
      just aft of the dome ring (its operator seated on the aisle side, facing outboard), the long science station
      over its hand ledge, and countermeasures at the aft end against the bulkhead. Port: the map table in a bay in
      the hull wall, its operator standing at the middle of the front edge, observers standing either side; aft of it
      the lockers, then the conning-tower ladder by the bulkhead. The lock-out trunk is in the floor on the
      centreline just astern of the table, its space kept clear.
  - id: bulkhead
    z: [1.5, 1.7]
    notes: Watertight hatch, which can isolate a flooding engineering space.
  - id: engineering
    z: [1.7, 4.7]
    notes: >
      The mechanic's end of the boat, louder and lower as the hull tapers. Engine and power, life support,
      ballast, the bilge well and the drop-weight release: every hands-on utility job, tightly packed.

# kind: seat (sit to use), chair (a free seat in the aisle), desk (a seated wall console), panel (stand at a wall),
# table, well (kneel), floor_hatch, ladder, storage, release_lever.
# side: port (-X), starboard (+X) or centre; x overrides side when given. footprint: [along the hull, across the hull].
# mount_height_m: a desk or table set into the curve of the hull; its depth is measured from the wall at that height.
stations:
  # z -3.9 (was -3.8): 0.1 m toward the bow so the strip's four toggles sit within the brief's reach_m 0.75 of the seated
  # hand (now 640 to 650 mm, was 690 to 720); the seat stays inside the cockpit (z -4.9 to -3.35). Tristan's decision on #482, arc #528.
  - {id: pilot,           compartment: cockpit,     kind: seat,  x: 0.0,  z: -3.9, footprint: [0.8, 0.7],
     display: {size: small, placement: a crisp 20 cm cylinder of light up and to the side of the apex gap, above the depth finder, purpose: chart locked centred on the sub; maybe a little zoom, never pan or rotate}}
  - {id: sonar,           compartment: midships,    kind: desk,  side: starboard, z: -2.95, footprint: [0.7, 0.65], mount_height_m: 0.75, faces: starboard,
     display: {size: large, placement: a 55 cm screen in a deep bezel on a steeply raked desk, purpose: the operator's own sub-centred view with zoom, pan and rotate; points the passive array; active sonar on and off}}
  # Sonar is turned to the hull (#598): the console's back is against the starboard hull and the operator sits on the
  # aisle side facing outboard, so the seat is inboard of the desk at the same z.
  - {id: sonar_seat,      compartment: midships,    kind: chair, side: starboard, z: -2.95, footprint: [0.6, 0.6], inboard_of: sonar, faces: starboard}
  # The science station (#529, reserved here by #598): a long starboard wall station, three module bays over a hand ledge,
  # taking the bulk of the wall between sonar and countermeasures. The operator stands in the aisle facing starboard.
  - {id: science,         compartment: midships,    kind: panel, side: starboard, z: -1.4, footprint: [1.2, 0.25], faces: starboard}
  # Countermeasures (#758): the aft end of the starboard wall, against the bulkhead (footprint ends at z 1.5). The full 1.0 m of
  # panel and decoy rack along the hull by 0.45 m deep (#767). It runs alongside the lock-out trunk (z 0.05 to 0.95), but the trunk
  # is on the centreline (x within 0.45) and the operator stands at x 0.9, so the hatch and the aisle stay clear.
  - {id: countermeasures, compartment: midships,    kind: panel, side: starboard, z: 1.0, footprint: [1.0, 0.45]}
  - {id: map_table,       compartment: midships,    kind: table, side: port,      z: -1.25, footprint: [2.2, 0.9], mount_height_m: 0.75,
     hologram_height_m: 0.7,
     display: {size: table, placement: a curved slab of light filling the D-shaped top, capped at 0.7 m tall, purpose: every scale for the crew; one operator moves the camera, observers place pins; everyone stands, so all share one perspective}}
  - {id: engineering,     compartment: engineering, kind: panel, side: starboard, z: 2.3, footprint: [1.2, 0.45]}
  - {id: life_support,    compartment: engineering, kind: panel, side: port,      z: 2.3, footprint: [1.0, 0.5]}
  # The engineering station (#530, placed by #572): the FLOOD and BLOW wheels on the ballast pipework, the drop-weights
  # button under its flip guard, the bilge switch and hand pump. z 3.4 (was 3.275) so the 1.2 m panel clears life support
  # (ends z 2.8); its pump lever ends toward the bow and a hose runs aft to the bilge well.
  - {id: ballast,         compartment: engineering, kind: panel, side: port,      z: 3.4, footprint: [1.2, 0.45]}
  - {id: bilge,           compartment: engineering, kind: well,  side: centre,    z: 4.35, footprint: [0.6, 0.9]}

features:
  - id: lock_out_trunk
    compartment: midships
    kind: floor_hatch
    side: centre
    z: 0.5
    footprint: [0.9, 0.9]
    notes: >
      Floor hatch into a one-person lock-out chamber below the deck, just aft of the map table, so the crew can
      read the table and step straight out. Climb down, seal the top hatch, flood, open the bottom hatch to the
      sea; the pumps are loud. Placed for play, not engineering realism.
  - {id: tower_ladder, compartment: midships, kind: ladder, side: port, z: 1.2, footprint: [0.4, 0.35],
     notes: Up into the conning tower and its top hatch, for docking at the ship or a station.}
  - {id: lockers, compartment: midships, kind: storage, side: port, z: 0.4, footprint: [0.4, 0.45],
     notes: Patches, scrubber canisters, cargo.}
  # Wall-mounted: takes no floor (`mounted`), so it is left out of the clearance report. The mission orders and
  # dive status, on the forward face of the bulkhead above the hatch (lintel 1.85 m), readable from the map table.
  - {id: status_board, compartment: bulkhead, kind: wall_display, side: centre, z: 1.5, footprint: [0.05, 1.0],
     mounted: true, board_bottom_m: 2.0, facing: forward,
     notes: "Orders and dive status, above the bulkhead hatch."}

displays:
  # Two charts, not one shared view: the pilot's small locked hologram and sonar's own screen, plus the map table.
  - The pilot has a 20 cm hologram locked centred on the sub, up and to the side of the apex gap, above the depth finder, clear of the forward view.
  - Sonar has its own 2D screen, on a console against the starboard hull that its seated operator faces, sub-centred by default but free to zoom, pan and rotate; it is not shared with the pilot.
  - The map table covers every scale for the crew to plan around; its hologram is capped at 0.7 m to fit the headroom.
  - Everyone at the map table stands to the table and leans over it (MapTable.lean_eye, 0.25 m down and 0.15 m toward the
    hologram), so the hologram is tuned for a standing eye of 1.65 m and a leaning eye of 1.40 m, about 0.65 m above the
    slab's top. A seated eye (1.2 m) would sit inside the slab. The top stays at desk height, so the slab still fits
    under the overhead. The operator's console is level with the table top and reached from the leaning eye.

design_notes:
  - "The operational core shares one volume: the pilot in the dome, sonar turned to the starboard hull just aft of the dome, the science station along the same wall, countermeasures at its aft end, and the map table on the port wall. Nobody is more than a few steps from anyone else."
  - Crew standing behind the pilot look over one head, out through the dome and down to the sea floor.
  - Countermeasures sits at the aft end of the starboard wall against the bulkhead, away from the table, so its operator works with their back to the quiet end of the boat.
  - Sonar gives up its forward view: its operator sits facing the hull, not past the pilot into the dome (#586).
  - The starboard wall carries the working stations, so the port side keeps the way out: the lock-out trunk's hatch stays clear on the centreline astern of the map table.
  - Rounds are an engineering job, behind the bulkhead, away from the table's chatter.
  - The ballast wheels, the drop-weight release and the bilge pumps share one port-wall station, all about staying afloat.

# Fixed cameras for the blockout renders, and later for the paint-over concepts and the build-vs-concept comparison.
# Sub-local metres: x starboard, y up from the hull's centre (the main deck is at y = -0.95), z toward the stern.
# Standing eyes are 1.65 m above their floor (y = 0.70 on the main deck). A camera with `seat:` sits at that seat's
# eye (1.2 m above its floor) and looks along look_dir. The dome glass is left out of eye-level shots (only its rim
# ring shows), as the concept art draws it: unbroken, no mullions.
# lens_mm is a full-frame equivalent. hide: object groups left out of that render (cutaways; crew figures are
# left out of the eye-level shots so they don't block the stations a paint-over needs to see). A flat sea floor
# 2 m under the keel gives the dome views something to look down at; the cutaways hide it.
cameras:
  - {id: midships_forward, pos: [0.25, 0.70, 1.05], look: [0.0, 0.05, -4.6], lens_mm: 16, hide: [crew, dome],
     notes: "Hero. Standing aft by the trunk looking forward: trunk, lockers and map table (port), countermeasures, science and sonar (starboard), the pilot in the dome."}
  - {id: pilot_view, seat: pilot, look_dir: [0.0, -0.15, -1.0], lens_mm: 18, hide: [crew, dome],
     notes: The pilot's view out of the dome, the small hologram up and to the side of the apex gap, above the depth finder.}
  - {id: sonar_view, seat: sonar_seat, look_dir: [1.0, -0.35, 0.0], lens_mm: 18, hide: [crew, dome],
     notes: Seated at the sonar console facing outboard, the screen ahead against the starboard hull.}
  - {id: science_view, pos: [0.95, 0.70, -1.4], look: [1.6, 0.35, -1.4], lens_mm: 18, hide: [crew, dome],
     notes: "Standing at the science station's operator point, 0.5 m from the panel, looking starboard along its three bays."}
  - {id: map_operator_view, pos: [0.05, 0.75, -0.7], look: [-1.25, -0.15, -1.4], lens_mm: 20, hide: [crew, dome],
     notes: "Over the standing operator's shoulder: the hologram slab ahead, the cowl above."}
  - {id: map_observer_view, pos: [0.65, 0.70, -0.2], look: [-1.25, -0.25, -1.45], lens_mm: 18, hide: [crew, dome],
     notes: Standing in the aisle across from the table, the science station behind the viewer.}
  - {id: engineering_aft, pos: [0.0, 0.70, 1.55], look: [0.0, -0.35, 4.6], lens_mm: 16, hide: [crew],
     notes: From the bulkhead hatch looking aft into engineering.}
  - {id: overview, pos: [-5.6, 5.8, 6.4], look: [0.0, -0.7, -0.2], lens_mm: 32, hide: [seafloor, shell_high, dome],
     notes: Cutaway from above, port quarter, the overhead removed.}
  - {id: top, pos: [0.0, 12.0, 0.0], look: [0.0, -1.0, 0.0], ortho: 10.8, hide: [seafloor, shell_high, dome, tower],
     notes: Orthographic plan, the overhead removed.}
  - {id: side, pos: [-12.0, -0.2, 0.0], look: [0.0, -0.2, 0.0], ortho: 10.8, hide: [seafloor, shell_port, dome_port],
     notes: Orthographic section from port, the port half of the hull removed.}
