# Sub interior program, draft 2 (the sub experiment, from a blank sheet).
# The layout is data: plan.py draws and checks it, and the blockout generator will build from it.
# Concept art is painted over the blockout's renders. Tristan's vision: reference/exterior_vision_tristan.webp.
# Units: metres. Frame: sub-local, bow toward -Z, +X starboard, Y up, origin at the hull's centre.

hull:
  # Outer pressure-hull envelope: a superellipse from the top (length x width) and from the front
  # (width x height). Wider than tall and full amidships, like the concept image. An exponent of 2 is
  # a true ellipse; higher is boxier.
  length_m: 10.0
  width_m: 3.8
  height_m: 3.0
  plan_exponent: 2.6         # top view
  profile_exponent: 4.0      # side view: fuller than the plan, so the ends keep their height (blunt bow and stern)
  section_exponent: 2.4      # front view
  wall_m: 0.12               # plating plus frames, inside the envelope
  deck_above_bottom_m: 0.55  # bilge, piping and the lock-out trunk's chamber sit below the deck plates
  crew: 4

clearances:                  # from the player capsule (radius 0.3, height 1.75)
  aisle_min_m: 0.8           # one person passes; two must squeeze (deliberate)
  walk_around_m: 0.8         # gap needed on each side of a centre item you walk round (the map table)
  head_clear_m: 2.0          # clear height needed above the deck along the walkway
  hatch_width_m: 0.75
  hatch_height_m: 1.7

# Bow to stern. z: [from, to].
compartments:
  - id: cockpit
    z: [-4.9, -3.0]
    notes: Glass dome. Pilot and sonar side by side, as in the concept image, so sonar calls are short and quiet.
  - id: forward
    z: [-3.0, -1.2]
    notes: Ballast manifold (port) and countermeasures (starboard), the forward rounds.
  - id: midships
    z: [-1.2, 1.6]
    notes: The widest section and the crew's hub. The map table, then the lock-out trunk in the floor just aft of it, and the ladder up into the conning tower.
  - id: bulkhead
    z: [1.6, 1.8]
    notes: Watertight hatch, which can isolate a flooding engineering space.
  - id: engineering
    z: [1.8, 4.7]
    notes: Machinery space, louder and lower, as the hull tapers. The aft rounds.

# kind: seat (sit to use), panel (stand at a wall), table (walk round), well (kneel), floor_hatch, ladder.
# side: port (-X), starboard (+X) or centre; x overrides side when given. footprint: [along the hull, across the hull].
stations:
  - {id: pilot,           compartment: cockpit,     kind: seat,  x: -0.5, z: -3.8, footprint: [0.9, 0.8]}
  - {id: sonar,           compartment: cockpit,     kind: seat,  x: 0.5,  z: -3.8, footprint: [0.9, 0.8]}
  - {id: ballast,         compartment: forward,     kind: panel, side: port,      z: -2.1, footprint: [1.2, 0.4]}
  - {id: countermeasures, compartment: forward,     kind: panel, side: starboard, z: -2.1, footprint: [1.0, 0.45]}
  - {id: map_table,       compartment: midships,    kind: table, side: centre,    z: -0.35, footprint: [1.1, 1.1]}
  - {id: engineering,     compartment: engineering, kind: panel, side: starboard, z: 2.45, footprint: [1.2, 0.45]}
  - {id: life_support,    compartment: engineering, kind: panel, side: port,      z: 2.45, footprint: [1.0, 0.5]}
  - {id: bilge,           compartment: engineering, kind: well,  side: centre,    z: 3.6, footprint: [0.7, 0.9]}

features:
  - id: lock_out_trunk
    compartment: midships
    kind: floor_hatch
    side: centre
    z: 0.7
    footprint: [0.9, 0.9]
    notes: >
      Floor hatch into a one-person lock-out chamber below the deck. Climb down, seal the top hatch, flood,
      open the bottom hatch to the sea, and reverse to come back in. The pumps are loud, so going out is a
      decision. It isn't how real subs do it; it's placed for play, so you can read the map table and step
      straight out.
  - {id: tower_ladder, compartment: midships, kind: ladder, side: port, z: 1.35, footprint: [0.4, 0.35],
     notes: Up into the conning tower and its top hatch, for docking at the ship or a station. Kept for looks too.}
  - {id: lockers, compartment: midships, kind: storage, side: starboard, z: 1.35, footprint: [0.4, 0.45],
     notes: Patches, scrubber canisters, cargo.}
  - {id: drop_weights, compartment: engineering, kind: release_lever, side: starboard, z: 3.6, footprint: [0.2, 0.15],
     notes: One-time emergency release.}

design_notes:
  - Four stations sit forward of the exit (pilot, sonar, ballast, countermeasures) and three aft (engineering, life support, bilge), so the sub reads as two halves around the hub, not one long tube.
  - Rounds go both ways from the hub. Ballast is forward; life support and bilge are aft, through the bulkhead.
  - The pilot can look back from the dome and see the crew at the table.
