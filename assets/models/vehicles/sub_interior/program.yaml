# Sub interior program, draft 4 (the sub experiment, from a blank sheet).
# The layout is data: plan.py draws and checks it, and the blockout generator will build from it.
# Concept art is painted over the blockout's renders. Tristan's vision: reference/exterior_vision_tristan.webp.
# Units: metres. Frame: sub-local, bow toward -Z, +X starboard, Y up, origin at the hull's centre.

hull:
  # Outer pressure-hull envelope: a superellipse from the top (length x width) and from the front
  # (width x height). Wider than tall and full amidships, like the concept image. An exponent of 2 is
  # a true ellipse; higher is boxier.
  length_m: 10.0
  width_m: 3.8
  height_m: 3.0
  plan_exponent: 2.6         # top view
  profile_exponent: 5.0      # side view: fuller than the plan, so the ends keep their height (a big bubble bow, a blunt stern)
  section_exponent: 2.4      # front view
  wall_m: 0.12               # plating plus frames, inside the envelope
  deck_above_bottom_m: 0.55  # bilge, piping and the lock-out trunk's chamber sit below the deck plates
  crew: 4

clearances:                  # from the player capsule (radius 0.3, height 1.75)
  aisle_min_m: 0.8           # one person passes; two must squeeze (deliberate)
  walk_around_m: 0.8         # gap needed on each side of a centre item you walk round (the map table)
  head_clear_m: 2.0          # clear height needed above the deck along the walkway
  hatch_width_m: 0.75
  hatch_height_m: 1.7

# Bow to stern. z: [from, to].
compartments:
  - id: cockpit
    z: [-4.9, -3.0]
    floor_offset_m: -0.20   # one step down: seated eyes at y = +0.05, the dome's centre. Deeper leaves no floor for two seats.
    notes: >
      Glass dome, cramped but fits two: pilot and sonar side by side, sunk a step below the main deck.
      Seated eyes sit at the dome's centre, so the view out is even all round. Standing crew in midships
      look over both heads and out through the dome too. A short step or two leads down from midships.
  - id: midships
    z: [-3.0, 1.2]
    notes: >
      The crowded catch-all and the crew's hub. Countermeasures stands beside the map table, so its
      operator can watch the table to see what their decoys are doing. Then the lock-out trunk in the floor
      just aft of the table, and the conning-tower ladder and lockers by the bulkhead.
  - id: bulkhead
    z: [1.2, 1.4]
    notes: Watertight hatch, which can isolate a flooding engineering space.
  - id: engineering
    z: [1.4, 4.7]
    notes: >
      The mechanic's end of the boat, louder and lower as the hull tapers. Engine and power, life support,
      ballast, the bilge well and the drop-weight release: every hands-on utility job.

# kind: seat (sit to use), panel (stand at a wall), table (walk round), well (kneel), floor_hatch, ladder.
# side: port (-X), starboard (+X) or centre; x overrides side when given. footprint: [along the hull, across the hull].
stations:
  - {id: pilot,           compartment: cockpit,     kind: seat,  x: -0.38, z: -3.4, footprint: [0.75, 0.7],
     display: {size: small, placement: low on the console, out of the forward view, purpose: heading-up chart for navigation; most of the field of view stays on the dome}}
  - {id: sonar,           compartment: cockpit,     kind: seat,  x: 0.38,  z: -3.4, footprint: [0.75, 0.7],
     display: {size: large, placement: close in front of the seat, filling much of the view, purpose: sonar picture centred on the sub at short range, plus the full chart controls (zoom, pins, route waypoints) so this seat can switch between reconnaissance and navigation}}
  - {id: countermeasures, compartment: midships,    kind: panel, side: starboard, z: -1.85, footprint: [1.0, 0.45]}
  - {id: map_table,       compartment: midships,    kind: table, side: centre,    z: -0.75, footprint: [1.1, 1.1],
     display: {size: table, placement: horizontal, walked round, purpose: the whole range of scales, from the entire site to zoomed in finer than sonar's view; planning, pins and routes for the whole crew}}
  - {id: engineering,     compartment: engineering, kind: panel, side: starboard, z: 2.0, footprint: [1.2, 0.45]}
  - {id: life_support,    compartment: engineering, kind: panel, side: port,      z: 2.0, footprint: [1.0, 0.5]}
  - {id: ballast,         compartment: engineering, kind: panel, side: port,      z: 3.1, footprint: [1.0, 0.4]}
  - {id: bilge,           compartment: engineering, kind: well,  side: centre,    z: 3.95, footprint: [0.7, 0.9]}

features:
  - id: lock_out_trunk
    compartment: midships
    kind: floor_hatch
    side: centre
    z: 0.3
    footprint: [0.9, 0.9]
    notes: >
      Floor hatch into a one-person lock-out chamber below the deck. Climb down, seal the top hatch, flood,
      open the bottom hatch to the sea, and reverse to come back in. The pumps are loud, so going out is a
      decision. It isn't how real subs do it; it's placed for play, so you can read the map table and step
      straight out.
  - {id: tower_ladder, compartment: midships, kind: ladder, side: port, z: 0.95, footprint: [0.4, 0.35],
     notes: Up into the conning tower and its top hatch, for docking at the ship or a station. Kept for looks too.}
  - {id: lockers, compartment: midships, kind: storage, side: starboard, z: 0.95, footprint: [0.4, 0.45],
     notes: Patches, scrubber canisters, cargo.}
  - {id: drop_weights, compartment: engineering, kind: release_lever, side: starboard, z: 3.1, footprint: [0.2, 0.15],
     notes: One-time emergency release, across the aisle from the ballast valves.}

displays:
  # One shared chart, shown three times at different scales and sizes. Each view can pan, zoom, pin and
  # set waypoints on the same chart, and every view sees the others' marks.
  - The pilot needs only a small heading-up chart, low and out of the way, because the dome is their view.
  - Sonar needs the sub-centred, short-range picture big and close, because it's their main input. Next to the pilot, sonar can swap between reconnaissance and navigation (route planning) without leaving the seat.
  - The map table covers every scale, from the whole site to finer than sonar, for the crew to plan around.
  - Showing the chart three times is fine; each copy serves a different scale and a different job.

design_notes:
  - "Two halves around the hub. Forward: pilot and sonar sunk into the dome, then countermeasures at the map table. Aft, through the bulkhead: engineering, life support, ballast and bilge, all the hands-on utility work."
  - The operational core (pilot, sonar, countermeasures and the table) shares one continuous volume. The sunken cockpit opens straight into midships, with no wall, so everyone running the boat is within a few steps and in sight of each other.
  - Rounds are an engineering job. Whoever does them works mostly behind the bulkhead, away from the table's chatter, and crosses the hub to get there.
  - Ballast and the drop-weight release face each other across the aft aisle; both are about staying afloat.
