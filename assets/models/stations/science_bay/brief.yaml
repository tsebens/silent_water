# Station brief for the science bay (concept #529), from the concept issue.
station: science_station

concept:
  images:
    - path: assets/models/science/concept/science_primary.png
      role: primary            # the station: three module bays in one row over a hand ledge (the art shows four; build three)
      view: a standing crew member in the aisle, the station on the hull to the left
      camera: concept_primary
    - path: assets/models/science/concept/science_modules_reference.png
      role: context            # the modules themselves, larger: their faces, latches, handles, the probe's reel; its vertical stack is NOT the layout
      view: from the aisle
      camera: concept_modules
  doc: assets/models/science/concept/science_concept.md
  compare_on:
    - overall massing: one long low housing along the hull, the bays side by side at chest height, the sloped hand ledge, the plate and running strip above
    - each module reading as a separate bolt-in unit in its own bay (rails, latches, orange side handles)
    - each module's distinct face (SCAN ring and range, SWEEP coverage grid, PROBE reel and counter, CAMERA hooded viewfinder)
    - colour blocking, matching the rest of the sub
  ignore:
    - the number of bays drawn (the brief's three wins), exact screen content, numbers and labels
    - the crew member, the background, lighting mood

functions:
  - id: bays
    furniture: three module bays in one row; each takes any one of the four module types; the fitted modules are a loadout (a Resource), default SCAN, SWEEP, CAMERA; choosing at the hub comes later, but the bay and module API supports a different fit now
    status: control only; new
  - id: operator
    control: one operator steps up to the station (like the map table); mapped keys select the active module (left and right) and work it (arm, shutter, aim with the mouse); stepping back with E or Esc
    binds: a station seat for standing operation, as MapTable does
    status: control only; new
  - id: module_screens
    display: while a module runs, its screen shows how well it is going, how long is left, and what would make it better (for example an arrow and CLOSER when getting closer would speed it up)
    status: control only; new
  - id: scan_module
    control: SCAN; arm it near a target; progress builds while the sub is within range and nearly still and drains slowly otherwise; loud while on (about 83 dB)
    binds: ScanObjective (src/objective/scan_objective.gd), today driven by the scanner switch on the engineering wall; the SCAN module replaces that switch and gauge
    status: implemented as an objective; the module is new
  - id: sweep_module
    control: SWEEP, the bathymetry sounder; arm it and the pilot flies survey lines over a marked area; coverage fills in on the screen
    binds: a new sweep objective (area, coverage target); active pings are loud and reveal the sub's position, like active sonar
    status: control only; new
  - id: probe_module
    control: PROBE; at a marked point, within a radius and depth band, lower the probe (a visible cable reel turns, a mechanical depth counter runs) and hold for a few seconds to log a temperature or sample reading
    binds: a new probe objective (a list of points); quiet but the sub must be still
    status: control only; new
  - id: camera_module
    control: CAMERA; aim the external camera with the mouse at a subject and take the shot with the shutter; quality from range, light and stillness, shown live on a light meter and a stillness indicator
    binds: a new photo objective (subjects); needs the external lights (EXT LTS) or a flash, which is bright
    status: control only; new
  - id: results
    display: a reading is done when it is complete and logged; the data rides on the sub, so the crew still has to get home
    status: new
  - id: power
    display: the modules draw on the battery with NO breaker for now (an unbreakable feed); breakers are a follow-up, #585
    binds: the power system's load (#539)
    status: control only
  - id: noise_repeater
    display: the shared noise repeater gauge
    status: implemented

constraints:
  kind: panel
  frame: back on Z=0 against the starboard hull, centred on the station, controls toward +Z
  operator_eye_m: [0.0, 0.55, 0.5]   # standing eye 1.65 m above the floor, the station centred at about 1.1 m, the crew member 0.5 m out
  reach_m: 1.1                 # from the shoulder, 0.25 m below the eye (docs/asset_process.md)
  size: about 1.2 m along the hull and 0.45 m deep (Decision #600): three bays of about 0.35 m plus the housing; the bays between waist and eye height
  modules: each module type is its own kit scene that fits any bay, so a fit can be changed; a bay looks right empty too
  triangle_budget: 4000        # panel, with up to three modules fitted
  palette: "every colour a palette swatch; screens use the cyan information band only for readouts (no rainbow depth bands; the sweep's depth colours come from the palette)"
  red_light: screens emit their own light and must read under the stealth red cabin light
