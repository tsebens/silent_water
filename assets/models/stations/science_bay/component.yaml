kind: panel
summary: 'Science bay: a long low raked housing with three module bays at chest height over a sloped hand ledge,
  a SCIENCE BAY plate and running strip above, the shared noise repeater on the ledge. Each bay is an anchor (Bay0..Bay2)
  whose child `Module` is a module scene (default SCAN, SWEEP, CAMERA); any of the four module scenes fits any bay,
  and an empty bay is a dark pocket.'
