summary: 'Science bay: a shallow housing with three module bays in a recessed, raked panel at chest height over
  a ledge band, a SCIENCE BAY plate and running strip above, the shared noise repeater and decorative controls on
  a proud upper panel. Each bay is an anchor (Bay0..Bay2) whose child `Module` is a module scene (default SCAN,
  SWEEP, CAMERA); any of the four module scenes fits any bay, and an empty bay is a dark pocket.'
