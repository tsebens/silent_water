    anchors: 'Anchors/<name> (Node3D; mount frame: +Z out of the fascia, +Y up the slope, +X toward the pilot''s
      right)'
    left_wing: DepthFinder, Multidisplay, SpeedGauge (from the gap outward); HologramAnchor above the depth finder,
      standing up
    right_wing: Navball, ExternalLightSwitch, ExternalColourSwitch, CabinLightSwitch, CabinColourSwitch, BilgeLamp,
      Co2Lamp, LowO2Lamp (on a dark plate, 8 mm proud), NoiseRepeater
    instances: each Anchors/<name> is the instrument's scene (lamps, switches, gauges, navball, depth finder, multidisplay);
      Drivers/<Lamp>Driver are ThresholdLamps; the four switches are not yet wired to the headlight and cabin lights
