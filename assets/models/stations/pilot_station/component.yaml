kind: station
summary: 'Pilot''s station: the pilot seat on the centreline facing -Z, and one knee-height instrument strip low
  against the dome in two faceted wings with orange end caps either side of a clear gap (600 mm). Marked anchors
  for every instrument (left wing from the gap outward: depth finder with the hologram above it, multidisplay, speed
  gauge; right wing: navball, four light switches, three warning lamps, noise repeater). Every instrument is placed:
  the scenes sit at the anchors, the lamps have ThresholdLamp drivers (bilge wired; CO2 and O2 unwired), the speed
  gauge''s scale follows the sub''s top speed, and each toggle and lamp has an engraved label plate.'
