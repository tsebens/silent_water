kind: station
summary: 'Pilot''s station: the pilot seat on the centreline facing -Z, and one knee-height instrument strip low
  against the dome in two equal faceted wings with orange end caps either side of a clear gap (400 mm). Left wing
  from the gap outward: depth finder with the hologram above it, then the speed/throttle gauge over the noise repeater;
  right wing: navball, multidisplay, and the BILGE, CO2 and LOW O2 lamps in a row along its top ledge. The four
  light switches are lit_toggles at the seat''s armrest anchors. Every instrument is placed: the scenes sit at the
  anchors, the lamps have ThresholdLamp drivers (bilge wired; CO2 and O2 unwired), the speed gauge''s scale follows
  the sub''s top speed, and each switch and lamp has an engraved label plate.'
tags:
- station
- pilot
- strip
- dome
- helm
- seat
scene: res://assets/models/stations/pilot_station/pilot_station.tscn
behaviour:
  script: null
  wire:
    seat: Seat/SitPoint (PilotSeat binds it; Seat/ThrottleJoystick and Seat/FlightJoystick take a JoystickIndicator)
    anchors: 'Anchors/<name> (Node3D; mount frame: +Z out of the fascia, +Y up the slope, +X toward the pilot''s
      right)'
    left_wing: DepthFinder, SpeedGauge and NoiseRepeater (stacked) from the gap outward; HologramAnchor above the
      depth finder, standing up
    right_wing: Navball, Multidisplay (from the gap outward); BilgeLamp, Co2Lamp, LowO2Lamp in a row on a dark plate
      along its top ledge (8 mm proud, facing up)
    switches: ExternalLightSwitch, ExternalColourSwitch, CabinLightSwitch, CabinColourSwitch are lit_toggle instances
      at the pilot_seat's armrest anchors (same names and frames as Seat/<name>)
    instances: each Anchors/<name> is the instrument's scene; Drivers/<Lamp>Driver are ThresholdLamps; HeadlightSwitch
      and CabinSwitch bind the switches by node name
