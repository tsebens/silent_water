slug: gauge
kind: display
summary: 'Round dial instrument: dark bezel and face, light needle and markings, title plate below. Reads a readout
  group; optional second needle.'
tags:
- gauge
- dial
- needle
- readout
- instrument
scene: res://assets/models/spike/kit/gauge/gauge.tscn
behaviour:
  script: Gauge
  reads: readout(name) on the first node in source_group
solids:
  body: res://assets/models/spike/kit/gauge/gauge_body.glb
  needle: res://assets/models/spike/kit/gauge/gauge_needle.glb
  used_by: src/interact/gauge.gd (preloaded)
extent_radii:
  bezel: 1.12
  plate_half_width: 0.85
  plate_bottom: 1.55
depth_mm:
  behind_origin: 10.0
  in_front_of_origin: 14.0
mount: dial face toward +Z, centred on the origin; the back is 10 mm behind the origin at every radius
set_on_instance:
  radius: m; scales the dial in X and Y
  title, readout, readout_b, source_group: what it shows
  min_value, max_value, wraps, wrap_labels: the scale
  sweep_deg, sweep_center_deg: how far the scale runs, and where its middle points (degrees clockwise from up)
  major_divisions, minor_per_division, show_scale: the markings
  face_color, marking_color, needle_color, needle_b_color: colours
triangles: 320
built_by: tools/cad_spike/components/gauge.py
