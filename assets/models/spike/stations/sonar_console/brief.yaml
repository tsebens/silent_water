# Station brief: the human's input at the top of the loop. Written for the spike (#345) from the locked cockpit
# concept (#328) and what the game's sonar station does today. Tristan would write this (or approve a draft of it).
station: sonar_console
summary: >
  The sonar operator's desk console, just aft of the dome on the starboard side. The operator sits facing it, trains
  the passive hydrophone, reads the bearing chart and the sonar dials, and switches active sonar. Modern, overbuilt,
  well kept: powder-grey steel with safety-orange structure, not a WW2 submarine.

concept:                              # the look and the arrangement; NOT the control list
  images:
    - path: assets/models/cockpit/concept/cockpit_sonar_console_reference.png
      role: primary                   # the console to build
      view: from behind the operator's left shoulder, console to the right
    - path: assets/models/cockpit/concept/cockpit_primary.png
      role: context                   # where the station sits; its flatter desk and smaller screen are superseded
      view: from behind the operator, console at the right of frame
  doc: assets/models/cockpit/concept/cockpit_concept.md
  compare_on:                         # what the concept review is allowed to judge
    - overall massing and silhouette (tall console, steeply raked desk, deep bezel)
    - screen size relative to the console (about 55 cm wide)
    - where the control strip sits (lower edge of the screen, under the hands) and the left-to-right order of its zones
    - seat position and height relative to the desk and screen
    - colour blocking (grey body, orange frame, dark bezel)
  ignore:                             # differences the review must not flag
    - number, type and labels of controls (the functional spec below decides those)
    - screen content, lighting mood, people, the dome and anything outside the console

functions:                            # authoritative: one entry per real game function
  - id: hydrophone_bearing
    control: trackball                # concept doc; the game's handwheel predates the concept (see decisions)
    binds: SonarStation.wheel
    status: implemented (bearing); trackball input is new
  - id: active_sonar
    control: guarded toggle with indicator lamp
    status: control only; active sonar is not implemented yet
  - id: chart_zoom_rotate
    control: four map keys (zoom in, zoom out, rotate left, rotate right)
    status: control only; the chart has no zoom or rotate yet
  - id: bearing_chart
    display: FlatChart screen, about 55 cm wide, in a deep bezel
    status: implemented
  - id: sonar_dials
    display: [BEARING, SIGNAL, BRG RATE dials, NOISE repeater]
    status: implemented; every station gets a noise repeater (design doc)
  - id: headset
    furniture: headset on a hook within reach of the seat
    status: implemented (sitting puts it on)
  - id: operator_seat
    furniture: operator seat facing the console; sitting puts the headset on
    binds: SonarSeat
    status: implemented

constraints:
  frame: floor at Y=0, console back on Z=0 (against the hull), operator at +Z facing -Z
  seated_eye_height_m: 1.2
  reach_m: 0.75                       # every control within this of the seated eye
  triangle_budget: 12000              # the interior class
  palette: assets/style_bible/kit_palette.yaml
