# Sensor array, draft 1 (#927). Raindrop's commonest unmanned site: a listening array on a shelf at the edge of a
# chasm. A central node vault and a fan of sensor posts reaching toward the drop, joined by cables on the seabed.
# Built for visitors (design doc, "Facilities" → "Unmanned infrastructure"): service hatches at a diver's working
# height, a hover point for the sub over the node, labels and work lights. tools/facility_plan/site.py checks and
# draws it; tools/facility_plan/blockout.py greyboxes it.
#
# Site frame as for the research station: metres, x along the ledge, z inland (the chasm at z < 0), y up, the seabed
# (top of the shelf) at y = 0.

site:
  ledge_edge_z: 0.0
  sub: {length_m: 10.0, width_m: 3.8, height_m: 3.0, tower_m: 1.5}

clearances:
  service_height_m: [0.6, 1.8]  # a diver works a hatch or panel whose centre is in this band above the ground it stands on
  service_room_m: 1.5           # clear water in front of a service point, for a diver to hang there
  hover_clear_m: 2.0            # the sub hovering over the node keeps this much water under its keel
  approach_width_m: 8.0         # the corridor the sub flies in along (its width plus margin either side)
  post_spacing_m: 12.0          # sensor posts at least this far apart, so they listen as an array
  max_cable_m: 70.0             # a cable run from the node to a post is no longer than this

# Elements: boxes (rect [x0, x1, z0, z1] and height) or cylinders (at [x, z], radius, height) standing on the seabed at
# base_y (default 0). role: node, post, mast, beacon, pinger, plinth, light, cable_bay. Tags mark objectives.
elements:
  - {id: node_plinth,  role: plinth, box: [-5, 5, 14, 22], height: 1.0}
  - {id: node,         role: node,   box: [-3.5, 3.5, 15.5, 20.5], base_y: 1.0, height: 3.5,
     notes: The node vault. Electronics, the data store and the power cell bay behind ribbed concrete. Faces the chasm.}
  - {id: node_mast,    role: mast,   cylinder: {at: [2.5, 19.5], radius: 0.35}, base_y: 4.5, height: 9.0,
     notes: Carries the pinger and the red beacon high above the node, so both reach far.}
  - {id: beacon,       role: beacon, cylinder: {at: [2.5, 19.5], radius: 0.45}, base_y: 13.5, height: 0.6}
  - {id: cable_bay,    role: cable_bay, box: [-5, -3.5, 16, 20], base_y: 1.0, height: 1.6,
     notes: Where the post cables come up out of the seabed into the node.}
  # Six sensor posts in a fan toward the edge: a heavy plinth, a ribbed mast, the sensor pod in a housing at diver height.
  - {id: post_1, role: post, cylinder: {at: [-30, 6], radius: 0.9}, height: 5.0, tags: [service_pod]}
  - {id: post_2, role: post, cylinder: {at: [-18, 3], radius: 0.9}, height: 5.0, tags: [service_pod]}
  - {id: post_3, role: post, cylinder: {at: [-6, 2], radius: 0.9}, height: 5.0, tags: [service_pod]}
  - {id: post_4, role: post, cylinder: {at: [6, 2], radius: 0.9}, height: 5.0, tags: [service_pod]}
  - {id: post_5, role: post, cylinder: {at: [18, 3], radius: 0.9}, height: 5.0, tags: [service_pod]}
  - {id: post_6, role: post, cylinder: {at: [30, 6], radius: 0.9}, height: 5.0, tags: [service_pod]}
  - {id: work_light_w, role: light, cylinder: {at: [-6.5, 13], radius: 0.25}, height: 3.0}
  - {id: work_light_e, role: light, cylinder: {at: [6.5, 13], radius: 0.25}, height: 3.0}

# Cables on the seabed: from the node's cable bay to each post. One may carry a break (an objective variant).
cables:
  - {id: cable_1, from: cable_bay, to: post_1, path: [[-5, 18], [-14, 14], [-30, 6]]}
  - {id: cable_2, from: cable_bay, to: post_2, path: [[-5, 17.5], [-12, 10], [-18, 3]], break_at: [-14, 7.6]}
  - {id: cable_3, from: cable_bay, to: post_3, path: [[-5, 17], [-6, 2]]}
  - {id: cable_4, from: cable_bay, to: post_4, path: [[-5, 16.5], [0, 12], [6, 2]]}
  - {id: cable_5, from: cable_bay, to: post_5, path: [[-5, 16], [6, 11], [18, 3]]}
  - {id: cable_6, from: cable_bay, to: post_6, path: [[-5, 16], [12, 12], [30, 6]]}
  - {id: power_in, from: cable_bay, to: offsite, path: [[-5, 19], [-40, 30], [-90, 60]],
     notes: Power and data from the network, toward the nearest junction. A dead site may mean a cut here.}

# Service points: where a diver works. at: [x, z], y: height of the point's centre, stand_y: the ground the diver
# hangs over, faces: the outward direction of the hatch (south = toward the chasm, -z).
service_points:
  - {id: data_coil, element: node,      at: [0, 15.5],  y: 2.4, stand_y: 1.0, faces: south, tags: [objective_data_coil],
     notes: The data store's hatch on the chasm face of the node.}
  - {id: reset_panel, element: node,      at: [3.5, 18],  y: 2.2, stand_y: 1.0, faces: east,  tags: [objective_reset]}
  - {id: power_cell, element: node,      at: [-2.5, 15.5], y: 2.0, stand_y: 1.0, faces: south, tags: [objective_power_cell],
     notes: The sealed cell's bay, for sites powered on site rather than by the cable.}
  - {id: cable_splice, element: cable_bay, at: [-5, 18], y: 1.6, stand_y: 1.0, faces: west, tags: [objective_splice]}
  - {id: pod_1, element: post_1, at: [-30, 5.1], y: 1.4, stand_y: 0.0, faces: south, tags: [objective_pod]}
  - {id: pod_2, element: post_2, at: [-18, 2.1], y: 1.4, stand_y: 0.0, faces: south, tags: [objective_pod]}
  - {id: pod_3, element: post_3, at: [-6, 1.1],  y: 1.4, stand_y: 0.0, faces: south, tags: [objective_pod]}
  - {id: pod_4, element: post_4, at: [6, 1.1],   y: 1.4, stand_y: 0.0, faces: south, tags: [objective_pod]}
  - {id: pod_5, element: post_5, at: [18, 2.1],  y: 1.4, stand_y: 0.0, faces: south, tags: [objective_pod]}
  - {id: pod_6, element: post_6, at: [30, 5.1],  y: 1.4, stand_y: 0.0, faces: south, tags: [objective_pod]}

# The sub: where it hovers to work the site (a diver goes out from here), and the way it comes in.
sub_hover: {at: [0, 10], heading: x}            # over the open water in front of the node, between it and the posts
approach: {from: [0, -60], to: [0, 10]}          # straight in from over the chasm
