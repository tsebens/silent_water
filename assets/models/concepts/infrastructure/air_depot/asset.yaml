slug: air_depot
issue: 927
stage: concept
description: 'A Raindrop air depot: an unmanned refuelling site on the open seafloor
  where a visiting research submarine docks to take on oxygen, ballast air and battery
  charge. The site is ONLY this: a low concrete plinth (the tank yard) carrying three
  tall cylindrical high-pressure gas bottles in ribbed concrete cradles, a squat concrete
  valve house with gauges and a valve panel at a diver''s working height, and a small
  charging unit fed by an armoured cable on the seabed; in front of the yard, a docking
  gantry: a heavy concrete arm about 7.5 m up on two pairs of square concrete legs,
  a lit docking collar in its underside, a small concrete transfer chamber on top
  of the arm, and a single gas main carried overhead from the valve house to the arm
  on one post. The submarine docks by sliding in beneath the arm and mating the hatch
  on top of its conning tower to the collar. The style board''s brutalism at a small
  scale: poured, board-marked concrete, ribs and chamfers, steel valve work and pipe
  flanges, overbuilt, weathered but maintained, safety markings as plain colour blocks
  (no legible text). Lighting: amber work lights and a lit ring around the collar,
  soft and fading fast into dark teal-to-black water, marine snow. Open empty seabed
  all around; a lone filling station in the dark. Fully submerged; no water surface,
  no other buildings, no railings, nothing sleek. When painting over a greybox render:
  keep the camera, the composition and every mass, and add no new structures. Grey
  blocks are concrete; the beige cylinders are the gas bottles; small dark boxes with
  amber bars are service panels; the amber ring under the arm is the collar; the orange
  capsule is the crew''s 10 m submarine, docked under the arm.'
created: '2026-11-28T06:09:42Z'
