slug: deterrent_pylon
issue: 927
stage: concept
description: 'A Raindrop deterrent pylon: an unmanned monument on the open seafloor
  that calls with the voice of the apex predator, so that lesser predators flee it
  and the apex itself comes to it. The site is ONLY this: a heavy square concrete
  plinth; on it a single tall ribbed concrete column about 12 m high, braced by three
  tall concrete buttress fins (left, right and back); a ring of amber lamps around
  the column near its top, the charge gauge; above it a dark, heavy emitter head,
  a squat drum ringed with acoustic transducers; a thin receiver mast on top. On the
  column''s front face at a diver''s working height, two framed service hatches with
  small amber lamp bars (the cell bay and the arming panel). The style board''s brutalism
  at a small scale: poured, board-marked concrete, ribs and chamfers, overbuilt and
  weathered but maintained, no glass. Ominous and solitary: a lone tower in the dark
  that something enormous answers. Lighting: the amber lamp ring and hatch lamps,
  soft and fading fast into dark teal-to-black water, marine snow. Open empty seabed
  all around. Fully submerged; no water surface, no other buildings, no railings,
  nothing sleek. When painting over a greybox render: keep the camera, the composition
  and every mass, and add no new structures. Grey blocks are concrete; the dark drum
  on top is the emitter head; the amber band is the lamp ring; small dark boxes with
  amber bars are service hatches; the orange capsule is the crew''s 10 m research
  submarine hovering nearby.'
created: '2026-11-28T05:23:00Z'
