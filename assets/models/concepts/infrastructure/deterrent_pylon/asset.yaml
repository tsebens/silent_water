  prompt: 'Silent Water: a dark, deep-ocean world. Everything humans built feels industrial,
    utilitarian and competent: overbuilt, honest, worn by age and pressure but never
    sloppy. Nature is soft, irregular and organic. Low-poly forms with flat shading
    and strong, readable silhouettes; shape matters more than texture or detail.


    Presentation: a scene, not a single subject. Keep the reference''s camera, perspective
    and framing exactly, wide angle included. The full environment is in frame and
    is the subject; nothing is isolated on a background. In-world light sources (cove
    lighting, lit screens, holograms, indicator lamps) may light the space, drawn
    as part of the scene; no bloom, glow halos, lens flare or other lens effects.
    People appear only when the brief asks for them.


    Raindrop''s infrastructure in brutalist concrete and steel: massive, honest, overbuilt,
    built to outlast the people who made it. Heavy horizontal slabs, stepped and cantilevered
    tiers, deep overhangs with ribbed or coffered undersides, repeated vertical fins
    and ribs, thick columns and splayed struts that show the load path. Long ribbon
    windows and slots set deep in the mass; glass is a small recessed exception. Identical
    repeated bays and modules. Board-marked or poured concrete, steel frames, trusses
    and railings, with matte surfaces and low-contrast wear. Neon is thin lines, strips
    and slots in soft amber, yellow or red, drawn as flat colour, not glow; emission
    is added in the engine.


    Paint over the first attached reference image. KEEP its composition, camera, proportions
    and major shapes exactly: the same extreme low-angle wide-angle view looking steeply
    up the tall square column, the same dark octagonal drum on top, the same two buttress
    fins at lower left and lower right, the same empty teal water filling the rest
    of the frame. Change only materials, surface detail, colour and lighting to match
    the style bible. Do not add or move any mass. Draw the column as poured, board-marked
    brutalist concrete with horizontal formwork lines, a few vertical ribs and chamfered
    corners, matte, with low-contrast weathering, faint stains and sparse marine growth,
    overbuilt and maintained. Draw both buttress fins as thick tall slabs of the same
    concrete, with chamfered edges and subtle ribbing. The third buttress is hidden
    behind the column. Replace the solid amber band with a slim concrete collar set
    well below the head, carrying a ring of small, separate, evenly spaced round amber
    lamps, each a flat-colour lamp in a small recessed housing. It must be clearly
    a row of individual lamps and not a continuous band, a stripe or a mouth, and
    the column must not read as a face. Give the dark drum head a heavy industrial
    steel-and-concrete look, with a ring of round acoustic transducers studded around
    it, and add a thin receiver mast rising from its top if the frame allows. Add
    nothing else: no cross-arms, no floating blocks, no extra buildings, no stairs,
    no railings. The lamps give soft amber light that fades quickly into dark teal-to-black
    water, with sparse marine snow drifting in the dark. Flat-shaded low-poly forms
    and a strong readable silhouette. No bloom, no glow halos, no lens effects. Fully
    submerged, with no water surface visible.


    Avoid:

    - baked-in lighting that is not from an in-world source, strong highlights, glossy
    reflections

    - text, logos, labels, watermarks, signatures

    - bloom, glow halos, lens flare, lens effects

    - bright, sunlit, tropical or cartoon ocean

    - photographic grain, noise, blur, depth of field

    - a changed camera, perspective or framing, or a cropped or isolated environment

    - sleek, smooth, rounded shapes; large glass domes or glazed walls

    - cyberpunk look, magenta-and-cyan neon, signage, floodlighting, glow and bloom

    - ornament, gothic or art deco detail

    - pristine new surfaces, or sloppy random damage

    - structures that read as rock'
