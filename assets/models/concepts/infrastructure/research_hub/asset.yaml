slug: research_hub
issue: null
stage: concept
description: 'Raindrop''s research and operations hub for the region: a large, imposing,
  multi-level brutalist facility on the seafloor, built right on the lip of a ledge
  and overhanging a vast underwater chasm too deep to see anything but its near edge,
  black below. Style (from the style board): stacked, cantilevered concrete tiers
  reaching far out past their base, with deep ribbed or coffered undersides; splayed,
  angled concrete struts (X and chevron piers, A-frames) that make the load path visible;
  vertical buttress fins ribbing the walls, giving a sense of fortification; small
  deep-set window slots and thin ribbon strips of glass. The docking hangar faces
  out over the chasm: a big framed mouth, lit inside, with room for several submersibles;
  the crew''s 10 m sub is small beside it. Secondary weathered steel gantries and
  truss masts, never the main mass. Thin neon strips along slab edges and slots, mostly
  amber with yellow accents and red on secondary edges, fading fast into the dark.
  Fully submerged: deep teal to black water, marine snow, no water surface anywhere.
  Walls are mostly blank concrete: never many identical floors stacked like an office
  block with continuous bands of windows, which breaks the solid, fortified mass.
  No railings, stairs or terraces as on land; nothing sleek or rounded; no floodlighting.
  Overbuilt, competent and stable, yet isolated and lonely: a lone outpost in an alien
  world.'
created: '2026-11-27T08:24:49Z'
