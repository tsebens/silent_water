    Raindrop''s infrastructure in brutalist concrete and steel: massive, honest, overbuilt,
    built to outlast the people who made it. Heavy horizontal slabs, stepped and cantilevered
    tiers, deep overhangs with ribbed or coffered undersides, repeated vertical fins
    and ribs, thick columns and splayed struts that show the load path. Long ribbon
    windows and slots set deep in the mass; glass is a small recessed exception. Identical
    repeated bays and modules. Board-marked or poured concrete, steel frames, trusses
    and railings, with matte surfaces and low-contrast wear. Neon is thin lines, strips
    and slots in soft amber, yellow or red, drawn as flat colour, not glow; emission
    is added in the engine.


    Wide establishing view from a low angle on the chasm''s far side of the ledge,
    looking back at the facility along the cliff edge: a long horizontal stack of
    heavy board-marked concrete slabs, stepped and cantilevered outward over the drop.
    Thick buttresses splay down the cliff face like fortress walls. Thin amber ribbon
    windows run in rows deep in the mass, and a few red slot lights show on the lower
    tier. The hangar mouth sits at the left end, wide and dark. A small 10 m submarine
    rests near it for scale. Black abyss in the foreground, marine snow drifting,
    dark teal water fading to black.


