slug: research_hub
issue: null
stage: concept
description: 'Raindrop''s research and operations hub for the region: a large, imposing,
  multi-level brutalist facility on the seafloor, built on the very edge of a ledge,
  looking out over a vast underwater chasm too deep to see anything but its near edge.
  Simple but formidable architecture: huge slabs of poured concrete broken only by
  thin strips of recessed window glass, with heavy reinforcing buttresses that make
  it read as a fortification. A large docking hangar opening big enough for several
  submersibles. Overbuilt, maintained, competent and stable, and at the same time
  isolated and lonely: a lone outpost in an alien world, deep ocean all round, dark
  teal to black water, marine snow. Soft amber, yellow and red neon in thin strips
  and window slots, fading fast into the dark. Scale: the crew''s 10 m submarine would
  be small beside it.'
created: '2026-11-27T08:24:49Z'
