    a dark sensor head on top. The small dark boxes on the node and posts become framed
    steel service hatches at working height, each with a thin amber lamp bar above
    it and a blank engraved label plate beside it. The two short amber-topped posts
    are small work-light posts on the seabed, one on each side of the node. The cables
    are thick segmented armoured cables, flat dark steel-grey, lying on the seabed.
    The beacon tip is a flat-colour red lamp, with no glow halo.


    Lighting comes from the amber hatch lamps, the work lights and the red beacon,
    drawn as flat colour with no bloom, halos or lens flare. Each source throws a
    soft, small pool of warm light on the nearby concrete and silt, and the light
    fades quickly. The distant posts at the edges of the row dissolve into dark teal-to-black
    water. Add sparse marine snow. The seabed is empty, open and dark all the way
    to the horizon, with no terrain features, rocks or structures. The whole site
    is small and alone, a lone machine in the dark, listening. Fully submerged, with
    no water surface, no people, no text, nothing sleek and no classical columns.


    Avoid:

    - baked-in lighting that is not from an in-world source, strong highlights, glossy
    reflections

