slug: sensor_array
issue: 927
stage: concept
description: 'A Raindrop sensor array: an unmanned listening site on the seafloor,
  one of the commonest and loneliest structures in the network. A central node vault,
  a heavy ribbed concrete block on a plinth, with a tall steel mast carrying a red
  beacon and an acoustic pinger; a fan of six sensor posts in front of it, each a
  ribbed concrete post on a wide foot with a sensor head on top and a pod housing
  at a diver''s working height; armoured cables lying on the seabed from the node
  to every post, one of them cut. Built for visiting crews, not residents: framed
  service hatches at a diver''s working height with a small amber lamp over each,
  grab rails, work lights on short posts, engraved label plates (no legible text).
  The style board''s brutalism at a small scale: poured, board-marked concrete, ribs
  and chamfers, heavy and overbuilt, little or no glass, weathered but maintained.
  Lighting: amber running lights and the red beacon, soft and fading fast into dark
  teal-to-black water, marine snow. A lone machine in the dark, listening. Not tied
  to any terrain: open seabed around it. Fully submerged; no water surface, no railings,
  nothing sleek. When painting over a greybox render of the site: keep the camera,
  the composition and every mass. Grey blocks are concrete; dark thin bars lying on
  the seabed are cables; small dark boxes on the node and posts are service hatches
  with amber lamp bars above them; amber-topped short posts are work lights; the tall
  thin pole with a red tip is the beacon mast; the orange capsule is the crew''s 10
  m research submarine hovering at the site.'
created: '2026-11-28T04:31:40Z'
