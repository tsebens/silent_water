# Class profiles for the asset pipeline. See assets/style_bible/README.md.
# Optional per class: budget_usd, a soft spend limit per asset (`asset cost` warns past it, nothing is blocked;
# an asset's manifest budget_usd overrides it). Placeholder figures: tune freely.
# Optional per class: turnaround_views, which views `asset turnaround` makes (default front, left, back, right;
# top and bottom are the other two).
# Optional per class: to3d_views, which turnaround views `asset to3d` sends by default, in order (after a provider
# entry's own `views:`; default front, left, back, right). `--views` overrides it per run.
# Optional per class: concept_presentation, `subject` (default) or `scene`: what `asset concept` uses when --presentation is absent.
# A `cad` class (kit) is modelled in Onshape and brought in with `asset import`: it has no concept, turnaround or to3d
# stage, `cleanup_recipe` names the import steps, and `silhouette_iou_min` is unused (there are no views to compare).
# Seeded from docs/art_direction.md; tune freely, tools/validate_style_bible.py checks the shape.
classes:
  creature:
    budget_usd: 5
    turnaround_views: [front, left, back, right, top, bottom]
    build_route: image-to-3d
    triangle_budget: 8000
    scale_range_m: [0.5, 40.0]
    snap_grid_m: null          # organic: no grid
    palette_size: 8
    cleanup_recipe: [repair, scale_and_pivot, decimate_to_budget, flat_shade, vertex_colour_palette, collision_helper]
    gates: {triangle_tolerance: 1.0, bbox_tolerance: 0.10, max_loose_parts: 1, max_non_manifold: 0, silhouette_iou_min: 0.80}
  prop:
    budget_usd: 2
    build_route: image-to-3d
    triangle_budget: 3000
    scale_range_m: [0.05, 4.0]
    snap_grid_m: null
    palette_size: 6
    cleanup_recipe: [repair, scale_and_pivot, decimate_to_budget, flat_shade, vertex_colour_palette, collision_helper]
    gates: {triangle_tolerance: 1.0, bbox_tolerance: 0.05, max_loose_parts: 4, max_non_manifold: 0, silhouette_iou_min: 0.85}
  terrain:
    budget_usd: 4
    build_route: image-to-3d
    triangle_budget: 20000
    scale_range_m: [5.0, 300.0]
    snap_grid_m: null
    palette_size: 6
    cleanup_recipe: [repair, scale_and_pivot, remesh_to_budget, flat_shade, vertex_colour_palette, collision_helper]
    gates: {triangle_tolerance: 1.0, bbox_tolerance: 0.15, max_loose_parts: 1, max_non_manifold: 0, silhouette_iou_min: 0.75}
  architecture:
    budget_usd: 3
    build_route: scripted
    triangle_budget: 6000
    scale_range_m: [1.0, 100.0]
    snap_grid_m: 0.5
    palette_size: 6
    cleanup_recipe: [snap_to_grid, scale_and_pivot, flat_shade, vertex_colour_palette, collision_helper]
    gates: {triangle_tolerance: 1.0, bbox_tolerance: 0.02, max_loose_parts: 32, max_non_manifold: 0, silhouette_iou_min: 0.90}
  interior:
    budget_usd: 3
    concept_presentation: scene
    build_route: scripted
    triangle_budget: 12000
    scale_range_m: [1.0, 30.0]
    snap_grid_m: 0.05
    palette_size: 8
    cleanup_recipe: [snap_to_grid, scale_and_pivot, flat_shade, vertex_colour_palette, collision_helper]
    gates: {triangle_tolerance: 1.0, bbox_tolerance: 0.02, max_loose_parts: 64, max_non_manifold: 0, silhouette_iou_min: 0.90}
  kit:
    budget_usd: 0
    build_route: cad
    triangle_budget: 1500
    scale_range_m: [0.01, 0.3]
    snap_grid_m: null
    palette_size: 4
    cleanup_recipe: [import_gltf, scale_and_pivot, weld, dissolve_coplanar, flat_shade, snap_materials_to_palette]
    gates: {triangle_tolerance: 1.0, bbox_tolerance: 0.02, max_loose_parts: 16, max_non_manifold: 0, silhouette_iou_min: 0.0}
